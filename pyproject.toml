[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflux"
version = "0.7.0"
description = "An autonomous agent: you give it a goal, it loops, evaluates itself, reflects, and keeps going."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "langgraph>=1.0",
]

[project.scripts]
autoflux = "autoflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoflux" = ["py.typed"]
"autoflux.tasks.bugfix" = ["workspace/**/*", "hidden/**/*"]
"autoflux.web" = ["index.html"]
# 默认数据表必须随包走：pip 装到别人机器上，examples/ 根本不存在
"autoflux.employment" = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv", "build", "dist", ".tmp", "runs", ".autoflux",
    "bench/tasks",                              # 给 agent 修的坏代码，故意留着 bug
    "src/autoflux/tasks/bugfix/workspace",      # 同上：起始工作区要保持原样
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S", "PLW", "C4", "ISC"]
# 中文文本里的全角标点是有意的，RUF001/2/3 会把它们全报成「歧义字符」
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]            # 测试就该用 assert
"examples/**" = ["S603"]         # 示例里按路径跑子进程，路径是本仓库自己的

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["autoflux"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

