[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflux"
version = "0.6.0"
description = "An autonomous agent: you give it a goal, it loops, evaluates itself, reflects, and keeps going."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "langgraph>=1.0",
]

[project.scripts]
autoflux = "autoflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoflux.tasks.bugfix" = ["workspace/**/*", "hidden/**/*"]
"autoflux.web" = ["index.html"]
