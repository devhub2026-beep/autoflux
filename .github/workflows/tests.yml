name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn langgraph ruff mypy coverage
      - name: 风格（ruff）
        run: python -m ruff check .
      - name: 类型（mypy）
        run: python -m mypy
      - name: 跑单元测试
        run: python -m unittest discover -s tests -t . -v
      - name: 覆盖率门槛（85%）
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          python -m coverage run --source=src/autoflux -m unittest discover -s tests -t .
          python -m coverage report --fail-under=85

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 能打成包
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: wheel 里该有的东西都在（含 py.typed）
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["autoflux/py.typed", "autoflux/web/index.html",
                  "autoflux/tasks/bugfix/hidden/hidden_cases.py",
                  "autoflux/employment/data/wages_2025.csv"]
          missing = [n for n in need if n not in names]
          assert not missing, missing
          print("wheel 内容 OK：", len(names), "个文件")
          PY
      - name: 能装上（不拉依赖，CI 里不验证上游）
        run: python -m pip install --no-deps dist/*.whl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 建镜像
        run: docker build -t autoflux:ci .
      - name: 镜像里 CLI 能跑（不联网）
        run: |
          docker run --rm autoflux:ci autoflux --help
          docker run --rm autoflux:ci autoflux tasks
          docker run --rm autoflux:ci python -c "import autoflux, sys; print(autoflux.__version__, sys.version.split()[0])"
      - name: 镜像里网页能起来
        run: |
          docker run -d --name autoflux-ci -p 8765:8765 autoflux:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf http://127.0.0.1:8765/api/runs
          docker logs autoflux-ci
          docker rm -f autoflux-ci
